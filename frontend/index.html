<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#1d4ed8" />
    <!-- Panel oturum arkasındadır; arama motorlarına açılmaz. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Kimlik (İE#10.5 ek — Ürün Sahibi talebi): profesyonel başlık/açıklama/ikon seti. -->
    <title>Tedarik App — Ürün Araştırma Asistanı</title>
    <meta name="description" content="Tedarik App: 1688 kaynaklı ürün araştırma ve sipariş listesi yönetimi — liste takibi, kur hesapları, Excel/PDF çıktı ve firma paylaşımı tek panelde." />
    <meta name="application-name" content="Tedarik App" />
    <meta name="apple-mobile-web-app-title" content="Tedarik App" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="icon" type="image/svg+xml" href="/panel/favicon.svg" />
    <link rel="apple-touch-icon" href="/panel/favicon.svg" />

    <!-- Sosyal önizleme (panel linki mesajla paylaşılırsa düzgün görünür; sayfa yine noindex). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tedarik App" />
    <meta property="og:title" content="Tedarik App — Ürün Araştırma Asistanı" />
    <meta property="og:description" content="1688 kaynaklı ürün araştırma ve sipariş listesi yönetimi." />

    <!-- K45 canlı vaka: /public/panel gibi yanlış adres statik açılınca SPA rotası
         tutmuyor ve sayfa BOŞ kalıyordu. Sayfa kendini doğru adrese taşır.
         (Normal /panel servis yolunda CSP bu satırı zaten çalıştırmaz; gerek de yok.) -->
    <script>
      if (location.pathname.indexOf('/public/') === 0) {
        location.replace(location.pathname.slice('/public'.length) + location.search + location.hash);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Bu panel JavaScript gerektirir.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
