name: CI

# K26: her push ve PR'da kalite hattı koşar. Deploy MANUEL kalır (CD yok — K13).
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# Composer, GitHub'dan paketleri KİMLİKSİZ indirince codeload 429/504 veriyor
# (canlı vaka: PR #13'te 4 job iki koşumda da bu yüzden kırmızıydı). GITHUB_TOKEN
# işe özel geçici token'dır; kimlikli istekte limit sorunu yoktur. Sır değildir,
# log'a yazılmaz — composer yalnız Authorization başlığında kullanır.
env:
  COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'

concurrency:
  # Aynı dala arka arkaya push gelirse eski koşumu iptal et — sıra beklemesin.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHPUnit + PHPStan + CS-Fixer + audit
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      - name: PHP 8.4 kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # Üretimdeki (docs/04 §7) ve testlerdeki eklentiler: sqlite testler için,
          # sodium TOTP secret şifrelemesi için (K27), bcmath para hesapları için (K14).
          extensions: bcmath, curl, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, pdo_sqlite, sodium, zip
          coverage: none
          tools: none

      - name: composer.json doğrula
        run: composer validate --strict

      - name: Composer önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Bağımlılıkları kur
        # --no-progress: log gürültüsünü azaltır. Lock dosyası repoda olduğu için sürümler sabittir (K19).
        # codeload 429/504 dalgalarına karşı 3 deneme + bekleme (canlı vaka: PR #13).
        run: |
          n=0; until composer install --no-interaction --no-progress; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1; echo "codeload hatası — 90 sn sonra deneme $((n+1))/3"; sleep 90
          done

      - name: PHPUnit (birim + servis + kurulum — Http dilimleri AYRI job'larda)
        # İE#22 D1/D2: `tests/Http` bu job'dan ÇIKTI ve dört paralel dilime
        # bölündü (aşağıdaki `http-dilim` matrisi). Ölçülen 13 dk'lık tek job,
        # en yavaş dilim kadar sürer. Dilim dışı kalan dosya olursa
        # `TestSuiteKapsamiTest` bu job'da kırmızı verir — bölme sessizce test
        # kaybettiremez.
        run: vendor/bin/phpunit --testsuite birim

      - name: PHPStan (seviye 6)
        run: composer stan

      - name: CS-Fixer (PSR-12, salt denetim)
        run: composer cs

      - name: Güvenlik denetimi
        # K19: her faz sonunda bağımlılık güvenlik denetimi raporlanır — burada her PR'da koşar.
        run: composer audit

  http-dilim:
    name: Http dilimi ${{ matrix.dilim }}
    runs-on: ubuntu-latest
    # İE#22 D1 (K19 onaylı): `tests/Http` dört paralel dilimde koşar. Bölme
    # `phpunit.xml`de DOSYA ADIYLA kayıtlıdır — gözle görülür, yerelde de aynı
    # komutla koşulur. Kapsam bekçisi (`TestSuiteKapsamiTest`) kalite job'unda
    # koşar ve dilim dışı kalan dosyayı kırmızıya çevirir.
    strategy:
      fail-fast: false
      matrix:
        dilim: [http-1, http-2, http-3, http-4]
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      - name: PHP 8.4 kur
        # GELISTIRME ZINCIRI 8.4 ISTER: php-cs-fixer'in cektigi symfony/console
        # v8 "php >= 8.4.1" beyan ediyor; dev bagimliliklariyla 8.3'te composer
        # kurulumu "lock uyumsuz" deyip isi kurulum adiminda dusuruyordu
        # (olculdu). Kalite job'i da bu yuzden 8.4 kullaniyor; dilimler onunla
        # ayni zeminde kosar. Uygulamanin CALISMA ZAMANI tabani ayri bir istir:
        # php-taban-uyum, 8.2 + 8.3 matrisi (K84).
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, pdo_sqlite, sodium, zip
          coverage: none

      - name: Bağımlılıkları kur
        run: |
          n=0; until composer install --no-interaction --no-progress; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1; echo "codeload hatası — 90 sn sonra deneme $((n+1))/3"; sleep 90
          done

      - name: ${{ matrix.dilim }}
        run: vendor/bin/phpunit --testsuite ${{ matrix.dilim }}

  mysql-integration:
    name: MySQL 8.4 entegrasyon (K37 §E12)
    runs-on: ubuntu-latest
    # Üç canlı-koşum hatasının kanıtladığı boşluk: SQLite sözleşme testleri MySQL'e
    # özgü DDL'i göremez. Bu iş temiz migration + kritik HTTP akışlarını gerçek
    # MySQL 8.4 üzerinde koşar (kurulum kilidi, auth, liste+ürün+para, şema doğrulama).

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tedarikapp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12

    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      - name: PHP 8.4 kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, pdo_sqlite, sodium, zip
          coverage: none
          tools: none

      - name: Composer önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Bağımlılıkları kur
        run: |
          n=0; until composer install --no-interaction --no-progress; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1; echo "codeload hatası — 90 sn sonra deneme $((n+1))/3"; sleep 90
          done

      - name: MySQL entegrasyon testleri
        env:
          TEDARIKAPP_TEST_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=tedarikapp_test;charset=utf8mb4'
          TEDARIKAPP_TEST_DB_USER: root
          TEDARIKAPP_TEST_DB_PASS: root
        run: vendor/bin/phpunit --group mysql

  db-degisikligi:
    name: DB dokunuşu var mı (İE#22 E5)
    runs-on: ubuntu-latest
    # K5 (rc8): MariaDB işi bugüne kadar KOŞULSUZ atlanıyordu — yeşil görünen
    # ama hiç koşmayan bir kapı. Artık kararı VERİ veriyor: PR migration'a,
    # depo katmanına ya da bağlantı/migrator koduna dokunuyorsa MariaDB koşar.
    # Dokunmuyorsa atlanır ve bu AÇIKÇA raporlanır — sessiz atlama yok.
    outputs:
      dokunuldu: ${{ steps.olc.outputs.dokunuldu }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Değişen dosyaları ölç
        id: olc
        run: |
          taban="${{ github.event.pull_request.base.sha }}"
          if [ -z "$taban" ]; then
            echo "PR değil (push/merge) — MariaDB koşacak."
            echo "dokunuldu=evet" >> "$GITHUB_OUTPUT"; exit 0
          fi
          degisen=$(git diff --name-only "$taban" "${{ github.event.pull_request.head.sha }}")
          echo "Değişen dosyalar:"; echo "$degisen"
          if echo "$degisen" | grep -qE '^(migrations/|app/Models/|app/Core/(Migrator|Database|Connection)\.php)'; then
            echo "DB dokunuşu VAR — MariaDB koşacak."
            echo "dokunuldu=evet" >> "$GITHUB_OUTPUT"
          else
            echo "DB dokunuşu YOK — MariaDB atlanıyor (K5: gerekçe raporlanır)."
            echo "dokunuldu=hayir" >> "$GITHUB_OUTPUT"
          fi

  mariadb-integration:
    name: MariaDB 11.4 entegrasyon (İE#19 E3)
    runs-on: ubuntu-latest
    # ÖNERİ VE GEREKÇE (emirde istendiği gibi): tam matris her PR'da iki kat MySQL
    # süresi demektir. Canlı sunucu MariaDB olabildiği için kapsam dışı bırakmak da
    # olmaz. Dengeyi şöyle kuruyoruz: PR'larda MySQL 8.4 (hızlı geri bildirim),
    # main'e MERGE'te ve `mariadb` etiketli PR'larda MariaDB 11.4. Böylece hiçbir
    # değişiklik MariaDB görülmeden main'e giremez, PR turu da yavaşlamaz.
    needs: db-degisikligi
    # İE#22 E5 (K5): koşul artık VERİYE dayanıyor — DB'ye dokunan PR, main'e
    # giden her değişiklik ve `mariadb` etiketli PR'lar koşar. Diğerleri
    # atlanır; atlamanın gerekçesi `db-degisikligi` job'ının günlüğündedir.
    if: >-
      needs.db-degisikligi.outputs.dokunuldu == 'evet' ||
      github.ref == 'refs/heads/main' ||
      contains(github.event.pull_request.labels.*.name, 'mariadb')

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: tedarikapp_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12

    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      - name: PHP 8.4 kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, pdo_sqlite, sodium, zip
          coverage: none
          tools: none

      - name: Composer önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Bağımlılıkları kur
        run: |
          n=0; until composer install --no-interaction --no-progress; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1; echo "codeload hatası — 90 sn sonra deneme $((n+1))/3"; sleep 90
          done

      - name: MariaDB üzerinde kritik sorgu + migration süiti
        env:
          TEDARIKAPP_TEST_DB_DSN: 'mysql:host=127.0.0.1;port=3307;dbname=tedarikapp_test;charset=utf8mb4'
          TEDARIKAPP_TEST_DB_USER: root
          TEDARIKAPP_TEST_DB_PASS: root
        run: vendor/bin/phpunit --group mysql

  php-taban-uyum:
    name: PHP taban uyumu (K84 — 8.2 tabanı)
    runs-on: ubuntu-latest
    # İE#22 C1: taban 8.2'ye çıktı (K84). Eski "8.1 uyum" işi düştü; yerine
    # DESTEKLENEN İKİ SÜRÜMÜN matrisi geldi. Sunucu MultiPHP'de 8.3'e alınıyor
    # (kullanıcı işi) ama kod 8.2'de de ayağa kalkmalı: taban beyanı 8.2 ise
    # 8.2'de koşmayan kod yalan söylüyor demektir.
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      - name: PHP ${{ matrix.php }} kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, fileinfo, gd, mbstring, openssl, pdo_mysql, pdo_sqlite, zip
          coverage: none
          tools: none

      - name: Üretim bağımlılıkları
        run: |
          n=0; until composer install --no-dev --optimize-autoloader --no-interaction --no-progress; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1; echo "codeload hatası — 90 sn sonra deneme $((n+1))/3"; sleep 90
          done

      - name: Sözdizimi taraması (uygulama + vendor)
        run: |
          hata=0
          while IFS= read -r f; do
            cikti=$(php -l "$f" 2>&1 | grep -v "No syntax errors" || true)
            if [ -n "$cikti" ]; then echo "$cikti"; hata=1; fi
          done < <(find app bin bootstrap public migrations vendor -name "*.php")
          [ $hata -eq 0 ] && echo "PHP ${{ matrix.php }} lint TEMIZ"

      - name: Platform gereksinimi bekçisi
        # Taban 8.2 olunca istisna listesine gerek kalmadı: zipstream-php ve
        # twofactorauth zaten >=8.2 istiyordu. Herhangi bir paket tabanı
        # tutmuyorsa job KIRMIZI olur — sessiz istisna yok.
        run: composer check-platform-reqs --no-dev

      - name: cURL seçenek kurulumu (İE#9.7 bekçisi)
        # Canlı vaka: CURLOPT_PROTOCOLS_STR (PHP 8.3+) lint'te görünmez, ilk
        # indirmede "Undefined constant" ile patladı. Seçenek dizisi GERÇEK
        # sürümde kurulur; 8.2 ve 8.3 ayrı ayrı sınanır.
        run: |
          php -r '
            require "vendor/autoload.php";
            $f = new App\Services\CurlMediaFetcher(new App\Services\UrlGuard(["alicdn.com"]));
            echo "cURL secenekleri PHP " . PHP_VERSION . " uzerinde kuruldu\n";
          '

  uretim-profili:
    name: Üretim profili (K41/K44)
    runs-on: ubuntu-latest

    # K44 disksiz simülasyonu gerçek MySQL ister (sihirbaz migrate + DB session).
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tedarikapp_smoke
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
    # docs/SUNUCU-PROFILI.md manifestinin otomatik bekçisi: sodium'suz şifreleme,
    # yazılamaz disk yolları (hotlink + DB-log), allow_url_fopen/mail yasağı statik
    # taraması ve açılış smoke'u. Hedef < 1 dk — her PR'da "bu kod Bünyamin'in
    # sunucusunda açılır mı?" sorusunun cevabı.

    steps:
      - name: Depoyu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (E4: SHA pin)

      - name: PHP 8.4 kur
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2 (E4: SHA pin)
        with:
          php-version: '8.4'
          # DİKKAT: sodium BİLEREK yok — üretim sunucusu profili (K39/K41).
          extensions: bcmath, curl, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, pdo_sqlite, zip
          coverage: none
          tools: none

      - name: Composer önbelleği
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4 (E4: SHA pin)
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Bağımlılıkları kur
        run: |
          n=0; until composer install --no-interaction --no-progress; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1; echo "codeload hatası — 90 sn sonra deneme $((n+1))/3"; sleep 90
          done

      - name: Üretim profili süiti
        run: vendor/bin/phpunit --group uretim-profili

      # ── K43: kendini doğrulayan release (İE#9.3 Görev 3) ──
      # Zip'i CI ÜRETİR, AÇAR ve ÇALIŞTIRIR: /setup gerçekten text/html döner,
      # /api/setup/state 200, integrity ucu "eksik yok" der. Üçü yeşil olmadan release yok.
      - name: Node 22 kur (panel build release zip'e girer)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 (E4: SHA pin)
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Panel derle
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Üretim vendor'ı (dev bağımlılıkları düşür — testler yukarıda koştu)
        run: |
          n=0; until composer install --no-dev --optimize-autoloader --no-interaction --no-progress; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1; echo "codeload hatası — 90 sn sonra deneme $((n+1))/3"; sleep 90
          done

      - name: Release üret + zip doğrulaması (bin/release.php)
        # E9: --panel-dal artık ZORUNLU. CI çıkarması pull_request olaylarında
        # ayrık HEAD'tir; damga da "HEAD" yazar — beyan ile damga aynı kaynaktan
        # okunur ve release.php commit eşleşmesini HEAD üzerinden doğrular.
        run: php bin/release.php --out=dist --version=ci-denetim --panel-dal="$(git rev-parse --abbrev-ref HEAD)"

      - name: Zip'i aç ve AÇILIŞI doğrula (setup HTML + state 200 + integrity temiz)
        run: |
          unzip -q dist/tedarikapp-ci-denetim.zip -d /tmp/rel
          php -S 127.0.0.1:8080 -t /tmp/rel/public /tmp/rel/public/index.php &
          sleep 2
          durum=$(curl -s -o /tmp/setup.html -w "%{http_code};%{content_type}" http://127.0.0.1:8080/setup)
          echo "GET /setup -> $durum"
          echo "$durum" | grep -q "^200;text/html" || { echo "HATA: /setup HTML dönmedi"; exit 1; }
          grep -q "tedarikapp kurulumu" /tmp/setup.html || { echo "HATA: sihirbaz sayfası içerik değil"; exit 1; }
          curl -sf http://127.0.0.1:8080/api/setup/state | grep -q '"success":true' || { echo "HATA: setup state"; exit 1; }
          curl -sf http://127.0.0.1:8080/api/system/integrity | tee /tmp/integrity.json
          grep -q '"ok":true' /tmp/integrity.json || { echo "HATA: integrity eksik dosya bildirdi"; exit 1; }
          # İE#9.8: açılan kopya release sürümünü taşımalı (/api/system/status bu sabiti döndürür;
          # uç Auth+CSRF istediği için sabit doğrudan okunur — aynı kaynak).
          surum=$(php -r "require '/tmp/rel/vendor/autoload.php'; echo App\\Core\\AppVersion::VALUE;")
          echo "Paket sürümü: $surum"
          [ "$surum" = "ci-denetim" ] || { echo "HATA: sürüm damgası yok (beklenen ci-denetim, gelen $surum)"; exit 1; }
          kill %1
          echo "Release açılış doğrulaması TAMAM"

      # ── K44: DİSKSİZ uçtan uca simülasyon — bu yeşil olmadan release YOK ──
      # session.save_path BİLEREK yok bir dizine çekilir + zip dizini salt-okunur yapılır
      # (yalnız kök config.php için yazılabilir bırakılır — sihirbaz otomatik yazar; üretimdeki
      # manuel akış aynı endpoint'lerden aynı state ile geçer). Sihirbaz requirements→done
      # TAM akar (şifreli çerez state), login sonrası oturum DB'de KORUNUR (sessions tablosu).
      - name: DİSKSİZ simülasyon — sihirbaz uçtan uca + login oturumu (K44)
        run: |
          cp -r /tmp/rel /tmp/disksiz
          # storage ve public dahil her yer SALT-OKUNUR; kök yazılabilir kalır (config.php + smoke kanıtı).
          chmod -R a-w /tmp/disksiz/storage /tmp/disksiz/public/media || true
          # APP_ENV=local: HTTPS şartı kendi testlerinde sınanır; bu simülasyonun konusu DİSK/OTURUM.
          APP_ENV=local php -d session.save_path=/yok-boyle-dizin -S 127.0.0.1:8090 -t /tmp/disksiz/public /tmp/disksiz/public/index.php &
          sleep 2
          php bin/smoke-kurulum.php http://127.0.0.1:8090 127.0.0.1 3306 tedarikapp_smoke root root
          echo "DİSKSİZ SİMÜLASYON TAMAM"

  eklenti:
    name: Eklenti (tsc + vitest + build)
    runs-on: ubuntu-latest
    # İE#11/K53: üretim bundle'ı repo'daki kaynaktan CI'da derlenir — bağımsız
    # denetlenebilirlik. Fixture testleri canlı 1688 isteği YAPMAZ (K35 kabulü).
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Depoyu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (E4: SHA pin)
      - name: Node 22 kur
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 (E4: SHA pin)
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Bağımlılıkları kur
        run: npm ci
      - name: WXT tip üretimi
        run: npx wxt prepare
      - name: Tip denetimi
        run: npm run typecheck
      - name: Bağımlılık güvenlik kapısı (İE#19 E1)
        # Eklenti ağacında 16 açık (5 kritik) birikmişti ve hiçbir job bunu
        # GÖRMÜYORDU: panelde `npm audit` vardı, eklentide yoktu. Eklenti kullanıcının
        # tarayıcısında, oturum açmış bir sayfada koşar — tedarik zinciri riski
        # burada paneldekinden DÜŞÜK değil, YÜKSEKTİR. Kapı artık her PR'da koşar.
        run: npm audit --audit-level=high

      - name: Fixture testleri (canlı istek YOK)
        run: npm test
      - name: Üretim bundle'ı + Store zip'i
        run: npm run zip
      - name: Zip'i artefakt olarak yükle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4 (E4: SHA pin)
        with:
          name: eklenti-zip
          path: extension/dist/*.zip
          retention-days: 30

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # CANLI DERS (İE#13): "Playwright kur" adımı apt kilidinde asılı kalıp GitHub'ın
    # 6 SAATLİK tavanına dayandı ve turu yaktı. Job'a tavan konur — takılan koşum
    # dakikalar içinde düşer, saatlerce sürünmez.
    timeout-minutes: 20
    # İE#13 Blok E (F22): uçtan uca akışlar GERÇEK MySQL + gerçek HTTP üzerinden koşar
    # (SQLite yok — E1). Eklenti E2E kapsam DIŞIDIR (E3): Playwright'ın MV3 desteği
    # kırılgandır; parser fixture testleri (eklenti job'ı) o boşluğu doldurur.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tedarikapp_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12

    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      - name: PHP 8.3 kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, pdo_sqlite, zip
          coverage: none
          tools: none

      - name: Composer önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Bağımlılıkları kur (dev araçları GEREKMEZ)
        # --no-dev: E2E uygulamayı çalıştırır, kod kalitesi araçlarını değil. Kilit
        # dosyasındaki dev paketleri (php-cs-fixer/symfony 8.x) PHP >= 8.4 ister;
        # bu job üretim tabanına yakın 8.3'te koşar ve onlara ihtiyaç duymaz.
        run: |
          n=0; until composer install --no-dev --optimize-autoloader --no-interaction --no-progress; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1; echo "codeload hatası — 90 sn sonra deneme $((n+1))/3"; sleep 90
          done

      - name: Node 22 kur
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Panel derle (E2E gerçek panele bakar)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Ortam dosyası (yalnız CI — sır değil, tek kullanımlık)
        run: |
          cat > .env <<'ENV'
          APP_ENV=local
          APP_URL=http://127.0.0.1:8099
          APP_KEY=e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0
          TZ=Europe/Istanbul
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=tedarikapp_e2e
          DB_USER=root
          DB_PASS=root
          LOG_DRIVER=file
          LOG_LEVEL=warning
          EXTENSION_TOKEN_SALT=e2e-salt-e2e-salt-e2e-salt-e2e-s
          TRANSLATE_ENABLED=0
          ENV

      - name: Şema + test kullanıcısı (2FA'sız — K45)
        run: |
          php bin/migrate.php
          php bin/user-create.php --email=e2e@tedarikapp.test --password=e2e-cok-gizli-sifre --no-totp

      - name: Bağımlılıklar + tip denetimi (e2e)
        working-directory: e2e
        timeout-minutes: 5
        run: |
          npm ci
          npm run typecheck

      # Tarayıcı ikilisi önbelleğe alınır: anahtar KİLİT DOSYASININ özetidir, yani
      # Playwright sürümü değişince (ve yalnız o zaman) yeni indirme yapılır.
      - name: Playwright tarayıcı önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      # `--with-deps` apt çalıştırır ve kilit beklerken ASILABİLİR (canlı ders).
      # Sistem kütüphaneleri ayrı ve NONINTERACTIVE kurulur, kendi tavanıyla;
      # düşerse tarayıcı yine kurulur (runner imajında kütüphaneler çoğunlukla vardır).
      - name: Chromium sistem kütüphaneleri (hata toleranslı)
        working-directory: e2e
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        continue-on-error: true
        run: npx playwright install-deps chromium

      # Bu adım HATA TOLERANSLI DEĞİLDİR: tarayıcı yoksa süit sessizce "yeşil"
      # görünemez — job burada hızlıca düşer (PM şartı).
      - name: Chromium indir
        working-directory: e2e
        timeout-minutes: 6
        run: |
          npx playwright install chromium
          npx playwright --version

      # rc8: EKLENTİ ARAYÜZ KÖPRÜSÜ DERLENİR (EKL-30/31 senaryoları bunu yükler).
      # `e2e/dist/` üretilmiş bir çıktıdır ve repoya girmez; CI'da derlenmezse
      # senaryolar "ENOENT arayuz.js" ile düşer — rc7'de tam olarak bu oldu.
      - name: E2E arayüz köprüsünü derle
        run: |
          npm ci --prefix frontend --silent
          ./frontend/node_modules/.bin/esbuild e2e/arayuz-giris.ts             --bundle --outfile=e2e/dist/arayuz.js --format=iife
          test -s e2e/dist/arayuz.js

      - name: Uygulamayı başlat
        run: |
          php -S 127.0.0.1:8099 -t public e2e/router.php > /tmp/e2e-server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8099/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8099/api/health | head -c 200

      - name: E2E süiti
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8099
        run: npm test

      - name: Sunucu günlüğü (hata ayıklama)
        if: failure()
        run: tail -100 /tmp/e2e-server.log

      - name: Playwright raporu
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-raporu
          path: e2e/playwright-report
          retention-days: 7

  gitleaks:
    name: Sır taraması (gitleaks)
    runs-on: ubuntu-latest
    # İE#10.5 Blok 5: sır sızıntısı taraması — CLAUDE.md §5'in otomatik bekçisi.
    #
    # İE#19 E2 — SAHTE YEŞİL KAPATILDI. Eylem, push olaylarında yalnız "yeni gelen"
    # commit aralığını tarıyordu; force-push, ilk push ve bazı merge senaryolarında
    # bu aralık BOŞ oluyor, log "0 commits scanned" yazıyor ve job YEŞİL dönüyordu.
    # Yani en riskli anlarda tarama HİÇ KOŞMUYORDU ama panoda tik görünüyordu.
    #
    # Yeni kurulum üç şey yapar:
    #   1. gitleaks ikilisi SÜRÜMÜ SABİT indirilir (eylem sürümü sürüklenmesi yok),
    #   2. GEÇMİŞ taranır ve "commits scanned" sayısı LOG'DAN OKUNUR; 0 ise job KIRMIZI,
    #   3. ÇALIŞMA AĞACI ayrıca taranır (--no-git): aralık ne olursa olsun her koşuda
    #      en az bir gerçek tarama yapılmış olur.
    steps:
      - name: Depoyu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (E4: SHA pin)
        with:
          fetch-depth: 0

      - name: gitleaks kur (sürüm sabit)
        env:
          GITLEAKS_SURUM: 8.28.0
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_SURUM}/gitleaks_${GITLEAKS_SURUM}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Geçmiş taraması (boş aralık = KIRMIZI)
        run: |
          set -o pipefail
          gitleaks detect --source . --redact --log-opts="--all" 2>&1 | tee /tmp/gitleaks-gecmis.log || DURUM=$?
          # Bulgu varsa gitleaks 1 döner; onu aşağıda ayrıca değerlendiriyoruz.
          taranan=$(grep -oE '[0-9]+ commits scanned' /tmp/gitleaks-gecmis.log | grep -oE '^[0-9]+' | tail -1)
          echo "Taranan commit sayısı: ${taranan:-bilinmiyor}"
          if [ -z "$taranan" ] || [ "$taranan" -eq 0 ]; then
            echo "HATA (E2): tarama BOŞ aralıkta koştu — bu bir yeşil DEĞİL, taramanın hiç yapılmamasıdır."
            exit 1
          fi
          if [ "${DURUM:-0}" -ne 0 ]; then
            echo "HATA: gitleaks geçmişte bulgu bildirdi."
            exit 1
          fi

      - name: Çalışma ağacı taraması (her koşuda gerçek tarama)
        run: gitleaks detect --source . --no-git --redact

  panel:
    name: Panel (tsc + eslint + build)
    runs-on: ubuntu-latest
    # K35: otomatik UI testi YOK. Bu iş tip denetimi, lint ve derlemenin geçtiğini gösterir;
    # ekran kabulü manuel listeyle yapılır.
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      - name: Node 22 kur
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları kur
        # npm ci: package-lock.json'a birebir uyar — sürümler sabittir (K19).
        run: npm ci

      - name: Tip denetimi
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      # rc8: EKLENTİ TİP KÖKÜ HAZIRLANIR.
      #
      # `frontend/src/eklenti/*` testleri `extension/` kaynaklarını doğrudan
      # içe aktarır; vitest bu dosyalar için `extension/tsconfig.json`u çözer ve
      # o dosya WXT'nin ÜRETTİĞİ `.wxt/tsconfig.json`u miras alır. Üretilmiş
      # dosya repoda yoktur: temiz checkout'ta dört süit "Cannot find module
      # './.wxt/tsconfig.json'" ile düşer. Geliştirici makinesinde dosya bir kez
      # üretildiği için sorun YEREL KOŞUMDA GÖRÜNMEZ — CI'nın yakaladığı sınıf
      # tam olarak budur.
      - name: Eklenti tip kökünü hazırla (WXT)
        working-directory: extension
        run: |
          npm ci --silent
          npx wxt prepare
          test -f .wxt/tsconfig.json

      - name: Birim testleri (vitest — İE#20 C11)
        # Kapsam BİLİNÇLİ OLARAK DAR: token bekçileri + davranışı olan bileşenler
        # (B11 eylem düğmesi). K35'in "ekran kabulü manueldir" kuralı duruyor;
        # bu adım yalnız DAVRANIŞ iddialarını güvenceye alır.
        run: npm test

      - name: Derleme
        run: npx vite build

      - name: Güvenlik denetimi
        run: npm audit --omit=dev --audit-level=high
