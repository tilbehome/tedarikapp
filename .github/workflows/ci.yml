name: CI

# K26: her push ve PR'da kalite hattı koşar. Deploy MANUEL kalır (CD yok — K13).
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# Composer, GitHub'dan paketleri KİMLİKSİZ indirince codeload 429/504 veriyor
# (canlı vaka: PR #13'te 4 job iki koşumda da bu yüzden kırmızıydı). GITHUB_TOKEN
# işe özel geçici token'dır; kimlikli istekte limit sorunu yoktur. Sır değildir,
# log'a yazılmaz — composer yalnız Authorization başlığında kullanır.
env:
  COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'

concurrency:
  # Aynı dala arka arkaya push gelirse eski koşumu iptal et — sıra beklemesin.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHPUnit + PHPStan + CS-Fixer + audit
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      - name: PHP 8.4 kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # Üretimdeki (docs/04 §7) ve testlerdeki eklentiler: sqlite testler için,
          # sodium TOTP secret şifrelemesi için (K27), bcmath para hesapları için (K14).
          extensions: bcmath, curl, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, pdo_sqlite, sodium, zip
          coverage: none
          tools: none

      - name: composer.json doğrula
        run: composer validate --strict

      - name: Composer önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Bağımlılıkları kur
        # --no-progress: log gürültüsünü azaltır. Lock dosyası repoda olduğu için sürümler sabittir (K19).
        # codeload 429/504 dalgalarına karşı 3 deneme + bekleme (canlı vaka: PR #13).
        run: |
          n=0; until composer install --no-interaction --no-progress; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1; echo "codeload hatası — 90 sn sonra deneme $((n+1))/3"; sleep 90
          done

      - name: PHPUnit
        run: composer test

      - name: PHPStan (seviye 6)
        run: composer stan

      - name: CS-Fixer (PSR-12, salt denetim)
        run: composer cs

      - name: Güvenlik denetimi
        # K19: her faz sonunda bağımlılık güvenlik denetimi raporlanır — burada her PR'da koşar.
        run: composer audit

  mysql-integration:
    name: MySQL 8.4 entegrasyon (K37 §E12)
    runs-on: ubuntu-latest
    # Üç canlı-koşum hatasının kanıtladığı boşluk: SQLite sözleşme testleri MySQL'e
    # özgü DDL'i göremez. Bu iş temiz migration + kritik HTTP akışlarını gerçek
    # MySQL 8.4 üzerinde koşar (kurulum kilidi, auth, liste+ürün+para, şema doğrulama).

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tedarikapp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12

    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      - name: PHP 8.4 kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, pdo_sqlite, sodium, zip
          coverage: none
          tools: none

      - name: Composer önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Bağımlılıkları kur
        run: |
          n=0; until composer install --no-interaction --no-progress; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1; echo "codeload hatası — 90 sn sonra deneme $((n+1))/3"; sleep 90
          done

      - name: MySQL entegrasyon testleri
        env:
          TEDARIKAPP_TEST_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=tedarikapp_test;charset=utf8mb4'
          TEDARIKAPP_TEST_DB_USER: root
          TEDARIKAPP_TEST_DB_PASS: root
        run: vendor/bin/phpunit --group mysql

  php81-uyum:
    name: PHP 8.1 uyum (K45 taban)
    runs-on: ubuntu-latest
    # Canlı sunucu MultiPHP ayarına göre 8.1 varsayılanına düşebiliyor (kanıtlı).
    # Taban 8.1: tüm çalışma-zamanı kodu + üretim vendor'ı gerçek 8.1 ile lint edilir,
    # uygulama 8.1 üzerinde AYAĞA KALKAR (sihirbaz state ucu 200).
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      - name: PHP 8.1 kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: bcmath, curl, fileinfo, gd, mbstring, openssl, pdo_mysql, pdo_sqlite, zip
          coverage: none
          tools: none

      - name: Üretim bağımlılıkları (paket php beyanları 8.2 der ama 8.1'de LINT ile kanıtlanır)
        run: |
          # php-64bit ayrı bir platform paketidir (İE#10 canlı vaka: zipstream-php ^8.2 beyanı) —
          # ikisi de yok sayılır; GERÇEK uyum kanıtı bu job'ın 8.1 lint + smoke adımlarıdır.
          n=0; until composer install --no-dev --optimize-autoloader --no-interaction --no-progress --ignore-platform-req=php --ignore-platform-req=php-64bit; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1; echo "codeload hatası — 90 sn sonra deneme $((n+1))/3"; sleep 90
          done

      - name: 8.1 sözdizimi taraması (uygulama + vendor)
        run: |
          hata=0
          while IFS= read -r f; do
            cikti=$(php -l "$f" 2>&1 | grep -v "No syntax errors" || true)
            if [ -n "$cikti" ]; then echo "$cikti"; hata=1; fi
          done < <(find app bin bootstrap public migrations vendor -name "*.php" ! -path "*platform_check*")
          [ $hata -eq 0 ] && echo "8.1 lint TEMIZ"

      - name: Platform gereksinimi bekçisi (İE#10.5 — istisnalar paket bazında belgeli)
        # config.platform.php=8.1.34 pini DENENDİ ve geri alındı: robthree/twofactorauth v3'ü
        # (php>=8.2 beyanlı) v2'ye düşürmeye zorluyor — TOTP kütüphanesi düşürmek mevcut
        # secret'lar için davranış riskidir. Bunun yerine bu adım: 8.1'de check-platform-reqs
        # koşar, BİLİNEN İKİ İSTİSNA dışında (zipstream-php, twofactorauth — ikisi de yalnız
        # METADATA'da 8.2+; gerçek 8.1 uyumu bu job'ın vendor lint + smoke adımlarıyla kanıtlı)
        # herhangi bir paket 8.1'i tutmuyorsa job KIRMIZI olur.
        run: |
          ihlal=$(composer check-platform-reqs --no-dev 2>/dev/null | grep -i "failed" | grep -vE "maennchen/zipstream-php|robthree/twofactorauth" || true)
          if [ -n "$ihlal" ]; then
            echo "HATA: 8.1 ile uyumsuz YENİ paket(ler):"; echo "$ihlal"; exit 1
          fi
          echo "Platform bekçisi TEMİZ (bilinen istisnalar: zipstream-php, twofactorauth — lint+smoke kanıtlı)"

      - name: 8.1 üzerinde cURL seçenek kurulumu (İE#9.7 bekçisi — tanımsız sabit lint'ten kaçamaz)
        # Canlı vaka: CURLOPT_PROTOCOLS_STR (PHP 8.3+) lint'te görünmez, ilk indirmede
        # "Undefined constant" ile patladı. Bu adım seçenek dizisini GERÇEK 8.1'de KURAR.
        run: |
          php -r '
            require "vendor/autoload.php";
            $f = new App\Services\CurlMediaFetcher(new App\Services\UrlGuard(["alicdn.com"]));
            $o = $f->requestOptions("https://cbu01.alicdn.com/img/ibank/ornek.jpg");
            if (!isset($o[CURLOPT_PROTOCOLS]) || $o[CURLOPT_PROTOCOLS] !== CURLPROTO_HTTPS) {
              fwrite(STDERR, "HATA: 8.1 yolunda CURLOPT_PROTOCOLS+CURLPROTO_HTTPS bekleniyordu\n"); exit(1);
            }
            echo "8.1 cURL secenek kurulumu TAMAM (yalniz https kisiti aktif)\n";
          '

      - name: 8.1 üzerinde açılış smoke'u
        run: |
          APP_ENV=local php -S 127.0.0.1:8070 -t public public/index.php &
          sleep 2
          curl -sf http://127.0.0.1:8070/api/setup/state | grep -q '"success":true' || { echo "HATA: 8.1'de sihirbaz açılmadı"; exit 1; }
          echo "8.1 açılış TAMAM"

  uretim-profili:
    name: Üretim profili (K41/K44)
    runs-on: ubuntu-latest

    # K44 disksiz simülasyonu gerçek MySQL ister (sihirbaz migrate + DB session).
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tedarikapp_smoke
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
    # docs/SUNUCU-PROFILI.md manifestinin otomatik bekçisi: sodium'suz şifreleme,
    # yazılamaz disk yolları (hotlink + DB-log), allow_url_fopen/mail yasağı statik
    # taraması ve açılış smoke'u. Hedef < 1 dk — her PR'da "bu kod Bünyamin'in
    # sunucusunda açılır mı?" sorusunun cevabı.

    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      - name: PHP 8.4 kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # DİKKAT: sodium BİLEREK yok — üretim sunucusu profili (K39/K41).
          extensions: bcmath, curl, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, pdo_sqlite, zip
          coverage: none
          tools: none

      - name: Composer önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Bağımlılıkları kur
        run: |
          n=0; until composer install --no-interaction --no-progress; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1; echo "codeload hatası — 90 sn sonra deneme $((n+1))/3"; sleep 90
          done

      - name: Üretim profili süiti
        run: vendor/bin/phpunit --group uretim-profili

      # ── K43: kendini doğrulayan release (İE#9.3 Görev 3) ──
      # Zip'i CI ÜRETİR, AÇAR ve ÇALIŞTIRIR: /setup gerçekten text/html döner,
      # /api/setup/state 200, integrity ucu "eksik yok" der. Üçü yeşil olmadan release yok.
      - name: Node 22 kur (panel build release zip'e girer)
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Panel derle
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Üretim vendor'ı (dev bağımlılıkları düşür — testler yukarıda koştu)
        run: |
          n=0; until composer install --no-dev --optimize-autoloader --no-interaction --no-progress; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1; echo "codeload hatası — 90 sn sonra deneme $((n+1))/3"; sleep 90
          done

      - name: Release üret + zip doğrulaması (bin/release.php)
        run: php bin/release.php --out=dist --version=ci-denetim

      - name: Zip'i aç ve AÇILIŞI doğrula (setup HTML + state 200 + integrity temiz)
        run: |
          unzip -q dist/tedarikapp-ci-denetim.zip -d /tmp/rel
          php -S 127.0.0.1:8080 -t /tmp/rel/public /tmp/rel/public/index.php &
          sleep 2
          durum=$(curl -s -o /tmp/setup.html -w "%{http_code};%{content_type}" http://127.0.0.1:8080/setup)
          echo "GET /setup -> $durum"
          echo "$durum" | grep -q "^200;text/html" || { echo "HATA: /setup HTML dönmedi"; exit 1; }
          grep -q "tedarikapp kurulumu" /tmp/setup.html || { echo "HATA: sihirbaz sayfası içerik değil"; exit 1; }
          curl -sf http://127.0.0.1:8080/api/setup/state | grep -q '"success":true' || { echo "HATA: setup state"; exit 1; }
          curl -sf http://127.0.0.1:8080/api/system/integrity | tee /tmp/integrity.json
          grep -q '"ok":true' /tmp/integrity.json || { echo "HATA: integrity eksik dosya bildirdi"; exit 1; }
          # İE#9.8: açılan kopya release sürümünü taşımalı (/api/system/status bu sabiti döndürür;
          # uç Auth+CSRF istediği için sabit doğrudan okunur — aynı kaynak).
          surum=$(php -r "require '/tmp/rel/vendor/autoload.php'; echo App\\Core\\AppVersion::VALUE;")
          echo "Paket sürümü: $surum"
          [ "$surum" = "ci-denetim" ] || { echo "HATA: sürüm damgası yok (beklenen ci-denetim, gelen $surum)"; exit 1; }
          kill %1
          echo "Release açılış doğrulaması TAMAM"

      # ── K44: DİSKSİZ uçtan uca simülasyon — bu yeşil olmadan release YOK ──
      # session.save_path BİLEREK yok bir dizine çekilir + zip dizini salt-okunur yapılır
      # (yalnız kök config.php için yazılabilir bırakılır — sihirbaz otomatik yazar; üretimdeki
      # manuel akış aynı endpoint'lerden aynı state ile geçer). Sihirbaz requirements→done
      # TAM akar (şifreli çerez state), login sonrası oturum DB'de KORUNUR (sessions tablosu).
      - name: DİSKSİZ simülasyon — sihirbaz uçtan uca + login oturumu (K44)
        run: |
          cp -r /tmp/rel /tmp/disksiz
          # storage ve public dahil her yer SALT-OKUNUR; kök yazılabilir kalır (config.php + smoke kanıtı).
          chmod -R a-w /tmp/disksiz/storage /tmp/disksiz/public/media || true
          # APP_ENV=local: HTTPS şartı kendi testlerinde sınanır; bu simülasyonun konusu DİSK/OTURUM.
          APP_ENV=local php -d session.save_path=/yok-boyle-dizin -S 127.0.0.1:8090 -t /tmp/disksiz/public /tmp/disksiz/public/index.php &
          sleep 2
          php bin/smoke-kurulum.php http://127.0.0.1:8090 127.0.0.1 3306 tedarikapp_smoke root root
          echo "DİSKSİZ SİMÜLASYON TAMAM"

  eklenti:
    name: Eklenti (tsc + vitest + build)
    runs-on: ubuntu-latest
    # İE#11/K53: üretim bundle'ı repo'daki kaynaktan CI'da derlenir — bağımsız
    # denetlenebilirlik. Fixture testleri canlı 1688 isteği YAPMAZ (K35 kabulü).
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7
      - name: Node 22 kur
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Bağımlılıkları kur
        run: npm ci
      - name: WXT tip üretimi
        run: npx wxt prepare
      - name: Tip denetimi
        run: npm run typecheck
      - name: Fixture testleri (canlı istek YOK)
        run: npm test
      - name: Üretim bundle'ı + Store zip'i
        run: npm run zip
      - name: Zip'i artefakt olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: eklenti-zip
          path: extension/dist/*.zip
          retention-days: 30

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # İE#13 Blok E (F22): uçtan uca akışlar GERÇEK MySQL + gerçek HTTP üzerinden koşar
    # (SQLite yok — E1). Eklenti E2E kapsam DIŞIDIR (E3): Playwright'ın MV3 desteği
    # kırılgandır; parser fixture testleri (eklenti job'ı) o boşluğu doldurur.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tedarikapp_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12

    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      - name: PHP 8.3 kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, pdo_sqlite, zip
          coverage: none
          tools: none

      - name: Composer önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Bağımlılıkları kur
        run: |
          n=0; until composer install --no-interaction --no-progress; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1; echo "codeload hatası — 90 sn sonra deneme $((n+1))/3"; sleep 90
          done

      - name: Node 22 kur
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Panel derle (E2E gerçek panele bakar)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Ortam dosyası (yalnız CI — sır değil, tek kullanımlık)
        run: |
          cat > .env <<'ENV'
          APP_ENV=local
          APP_URL=http://127.0.0.1:8099
          APP_KEY=e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0
          TZ=Europe/Istanbul
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=tedarikapp_e2e
          DB_USER=root
          DB_PASS=root
          LOG_DRIVER=file
          LOG_LEVEL=warning
          EXTENSION_TOKEN_SALT=e2e-salt-e2e-salt-e2e-salt-e2e-s
          TRANSLATE_ENABLED=0
          ENV

      - name: Şema + test kullanıcısı (2FA'sız — K45)
        run: |
          php bin/migrate.php
          php bin/user-create.php --email=e2e@tedarikapp.test --password=e2e-cok-gizli-sifre --no-totp

      - name: Playwright kur
        working-directory: e2e
        run: |
          npm ci
          npm run typecheck
          npx playwright install --with-deps chromium

      - name: Uygulamayı başlat
        run: |
          php -S 127.0.0.1:8099 -t public e2e/router.php > /tmp/e2e-server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8099/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8099/api/health | head -c 200

      - name: E2E süiti
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8099
        run: npm test

      - name: Sunucu günlüğü (hata ayıklama)
        if: failure()
        run: tail -100 /tmp/e2e-server.log

      - name: Playwright raporu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-raporu
          path: e2e/playwright-report
          retention-days: 7

  gitleaks:
    name: Sır taraması (gitleaks)
    runs-on: ubuntu-latest
    # İE#10.5 Blok 5: commit geçmişi dahil sır sızıntısı taraması — CLAUDE.md §5'in
    # otomatik bekçisi. Bulgu = job kırmızı; yanlış pozitifler .gitleaksignore ile yönetilir.
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  panel:
    name: Panel (tsc + eslint + build)
    runs-on: ubuntu-latest
    # K35: otomatik UI testi YOK. Bu iş tip denetimi, lint ve derlemenin geçtiğini gösterir;
    # ekran kabulü manuel listeyle yapılır.
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      - name: Node 22 kur
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları kur
        # npm ci: package-lock.json'a birebir uyar — sürümler sabittir (K19).
        run: npm ci

      - name: Tip denetimi
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Derleme
        run: npx vite build

      - name: Güvenlik denetimi
        run: npm audit --omit=dev --audit-level=high
