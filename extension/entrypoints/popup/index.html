<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Tedarikapp</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app">
      <header class="baslik">
        <strong>Tedarikapp</strong>
        <span id="durum" class="durum">bağlantı denetleniyor…</span>
      </header>

      <p id="baglanti-hata" class="tdk-uyari" hidden></p>

      <!-- Ayar ekranı: panel adresi + token (yalnız chrome.storage'da yaşar) -->
      <section id="ayarlar" hidden>
        <label>Panel adresi
          <input id="panel-url" type="url" placeholder="https://tedarikapp.ornek.com" />
        </label>
        <label>Eklenti token'ı
          <input id="token" type="password" placeholder="tdk_…" />
        </label>
        <p class="ipucu">Token, panel &gt; Ayarlar &gt; Güvenlik'ten üretilir.</p>
        <button id="kaydet" type="button">Kaydet ve bağlan</button>
      </section>

      <!-- Yakalama formu buraya monte edilir (ui/captureForm — mini panelle ORTAK). -->
      <section id="yakala" hidden></section>

      <section id="desteklenmiyor" hidden>
        <p id="desteklenmiyor-metin">Bu sayfa desteklenmiyor. Eklenti <code>detail.1688.com</code> ürün sayfalarında çalışır.</p>
        <button id="ayar-ac-2" type="button" class="baglanti">Bağlantı ayarları</button>
      </section>

      <button id="ayar-ac" type="button" class="baglanti">Bağlantı ayarları</button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
