<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tedarik App Eklenti Popup</title>
  <style>
    *{box-sizing:border-box}body{width:400px;margin:0;background:#FFFDF8;color:#1F2530;font:14px Inter,Arial,sans-serif}.top{height:96px;display:flex;align-items:center;padding:16px 18px;border-bottom:4px solid #FF6B00}.top img{width:64px;height:64px}.name{margin-left:10px}.name strong{font-size:20px}.name strong span{color:#FF6B00}.name small{display:block;color:#6B7280;margin-top:4px}.connected{margin-left:auto;background:#E8F8F2;color:#067647;padding:8px 11px;border-radius:999px;font-size:11px;font-weight:700}
    main{padding:20px}.site{display:flex;justify-content:space-between;background:#FFF8F1;border:1px solid #E7D9CA;border-radius:12px;padding:12px}.site small{color:#6B7280}.progress{display:grid;gap:8px;margin:18px 0}.row{display:flex;align-items:center;gap:9px;color:#6B7280}.row.active{color:#1F2530;font-weight:700}.dot{width:10px;height:10px;border-radius:50%;background:#E7D9CA}.active .dot{background:#FF6B00;box-shadow:0 0 0 4px #FFE4CF}.primary{width:100%;height:48px;border:0;border-radius:12px;background:#FF6B00;color:#fff;font-weight:700}.foot{display:flex;justify-content:space-between;margin-top:14px;color:#6B7280;font-size:11px}
  </style>
</head>
<body>
  <header class="top"><img src="../logo/tedarik-app-mark.png" alt="Tedarik App"><div class="name"><strong>Tedarik <span>App</span></strong><small>Ürün aktarım yardımcısı</small></div><span class="connected">● Bağlı</span></header>
  <main><div class="site"><div><strong>1688 ürün sayfası</strong><small>Ürün verisi algılandı</small></div><span>867966081795</span></div><div class="progress"><div class="row active"><span class="dot"></span>Aktarıma hazır</div><div class="row"><span class="dot"></span>Görseller hazırlanacak</div><div class="row"><span class="dot"></span>Panelde liste seçilecek</div></div><button class="primary">Ürünü Tedarik App'e Aktar</button><div class="foot"><span>Ayarlar</span><span>v1.0.0</span></div></main>
</body>
</html>
