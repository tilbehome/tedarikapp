<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>TedarikApp — Firma Teklif Portalı Prototipi</title>
  <style>
    :root{
      --navy:#0F2557;--navy-2:var(--navy);--navy-3:var(--navy);--gold:#D4A017;--gold-2:var(--gold);
      --ink:var(--navy);--muted:var(--gray-500);--line:var(--gray-100);--soft:var(--gray-100);--white:#fff;
      --green:var(--success);--green-bg:var(--success-bg);--amber:var(--warning);--amber-bg:var(--warning-bg);
      --red:var(--danger);--red-bg:var(--danger-bg);--blue:var(--navy);--blue-bg:var(--gray-100);
      --shadow:0 18px 44px var(--shadow-color);--radius:18px;--safe:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box}
    html{font-size:16px;scroll-behavior:smooth}
    body{margin:0;background:var(--gray-100);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,"Noto Sans SC",sans-serif;line-height:1.45}
    button,input,select,textarea{font:inherit;color:inherit}
    button,a{touch-action:manipulation}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.48}
    :focus-visible{outline:3px solid var(--shadow-color);outline-offset:2px}
    .app{min-height:100vh;padding-bottom:calc(88px + var(--safe))}
    .topbar{position:sticky;top:0;z-index:50;background:linear-gradient(120deg,var(--navy-3),var(--navy) 62%,var(--navy));color:#fff;border-bottom:4px solid var(--gold)}
    .topbar-inner{max-width:1500px;margin:auto;padding:16px 24px 13px;display:grid;grid-template-columns:minmax(270px,1.1fr) minmax(420px,1.8fr) auto;gap:22px;align-items:center}
    .brand{display:flex;gap:13px;align-items:center;min-width:0}
    .brand-mark{width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--navy),var(--navy));box-shadow:inset 0 1px var(--shadow-color),0 8px 24px var(--shadow-color)}
    .brand-mark svg{width:27px;height:27px}
    .eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.14em;color:var(--gray-100);text-transform:uppercase}
    .brand h1{font-size:1.18rem;line-height:1.1;margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .context{display:grid;grid-template-columns:1.2fr 1.2fr .7fr;gap:10px}
    .context-item{border-left:1px solid var(--shadow-color);padding-left:14px;min-width:0}
    .context-label{font-size:.7rem;color:var(--gray-300);font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .context-value{font-size:.88rem;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .top-actions{display:flex;align-items:center;gap:10px}
    .lang{display:flex;padding:4px;background:var(--shadow-color);border:1px solid var(--shadow-color);border-radius:13px}
    .lang button{border:0;background:transparent;color:var(--gray-100);min-width:44px;height:36px;border-radius:9px;font-weight:800;font-size:.78rem}
    .lang button[aria-current="true"]{background:#fff;color:var(--navy);box-shadow:0 4px 14px var(--shadow-color)}
    .connection{width:44px;height:44px;border-radius:13px;border:1px solid var(--shadow-color);background:var(--shadow-color);color:#fff;display:grid;place-items:center}
    .connection svg{width:20px;height:20px}
    .workflow-wrap{background:#fff;border-bottom:1px solid var(--line)}
    .workflow{max-width:1500px;margin:auto;padding:10px 24px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
    .workflow button{position:relative;display:flex;align-items:center;gap:10px;text-align:left;border:1px solid transparent;background:transparent;border-radius:12px;padding:8px 10px;min-width:0}
    .workflow button:not(:last-child)::after{content:"";position:absolute;height:1px;width:17px;background:var(--gray-100);right:-13px;top:50%}
    .wf-dot{width:29px;height:29px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--gray-100);color:var(--navy);background:#fff;font-size:.72rem;font-weight:900}
    .workflow button.done .wf-dot{background:var(--green);border-color:var(--green);color:#fff}
    .workflow button.current{background:var(--amber-bg);border-color:var(--warning-bg)}
    .workflow button.current .wf-dot{background:var(--gold);border-color:var(--gold);color:#fff;box-shadow:0 0 0 4px var(--shadow-color)}
    .wf-text{min-width:0}
    .wf-code{font:700 .66rem ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--navy);letter-spacing:.03em}
    .wf-label{font-size:.77rem;font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .page{max-width:1500px;margin:0 auto;padding:20px 24px 0;display:grid;grid-template-columns:238px minmax(0,1fr);gap:20px}
    .side{position:sticky;top:176px;align-self:start;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 10px 28px var(--shadow-color)}
    .side button{width:100%;min-height:52px;display:grid;grid-template-columns:31px minmax(0,1fr);gap:8px;align-items:center;text-align:left;border:0;background:transparent;border-radius:12px;padding:8px;color:var(--navy)}
    .side button+button{margin-top:3px}
    .side button.active{background:linear-gradient(100deg,var(--gray-100),var(--gray-100));color:var(--navy);box-shadow:inset 3px 0 var(--gold)}
    .step-no{font:800 .72rem ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--navy)}
    .side button.active .step-no{color:var(--gold)}
    .step-label{font-size:.83rem;font-weight:800;line-height:1.25}
    .source-proof{margin:10px 4px 2px;padding-top:10px;border-top:1px solid var(--line);font:650 .64rem/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--navy);word-break:break-word}
    .surface{min-width:0}
    .screen-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin:2px 0 15px}
    .screen-kicker{font:800 .72rem ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--gold);letter-spacing:.08em}
    .screen-head h2{margin:4px 0 0;color:var(--navy);font-size:1.62rem;line-height:1.2;letter-spacing:-.02em}
    .key{display:block;margin-top:4px;color:var(--navy);font:650 .64rem ui-monospace,SFMono-Regular,Consolas,monospace}
    .save-state{min-height:36px;display:flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--navy);font-size:.78rem;font-weight:750;white-space:nowrap}
    .save-state .pulse{width:8px;height:8px;border-radius:50%;background:var(--green)}
    .save-state.busy .pulse{background:var(--gold);animation:pulse 1s infinite}
    .save-state.offline .pulse{background:var(--red)}
    @keyframes pulse{50%{opacity:.25}}
    .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 30px var(--shadow-color)}
    .card-pad{padding:22px}
    .hero{overflow:hidden;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,.8fr);min-height:270px}
    .hero-main{padding:28px;background:linear-gradient(150deg,#fff 0%,var(--gray-100) 70%);position:relative}
    .hero-main::after{content:"";position:absolute;right:-60px;bottom:-100px;width:250px;height:250px;border-radius:50%;border:45px solid var(--shadow-color)}
    .hero h3{font-size:2rem;line-height:1.15;letter-spacing:-.035em;color:var(--navy);margin:0;max-width:720px}
    .hero p{font-size:1.02rem;color:var(--navy);max-width:720px;margin:12px 0 22px}
    .hero-meta{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .meta-pill{padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--navy);font-size:.82rem;font-weight:750}
    .hero-side{padding:24px;background:linear-gradient(145deg,var(--navy),var(--navy));color:#fff;display:flex;flex-direction:column;justify-content:space-between}
    .hero-side .key{color:var(--gray-300)}
    .instruction-title{display:flex;align-items:center;gap:9px;font-weight:900;font-size:1.02rem}
    .instruction-list{display:grid;gap:10px;margin:17px 0 21px}
    .instruction-item{display:grid;grid-template-columns:20px 1fr;gap:9px;align-items:start;color:var(--gray-100);font-size:.84rem}
    .instruction-item svg{width:17px;height:17px;color:var(--gold-2);margin-top:2px}
    .section{margin-top:14px}
    .section-title{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:11px}
    .section-title h3{margin:0;font-size:1rem;color:var(--navy)}
    .btn{min-height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:9px 15px;font-weight:850;font-size:.84rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
    .btn svg{width:17px;height:17px}
    .btn-primary{background:linear-gradient(140deg,var(--navy),var(--navy-2));border-color:var(--navy);color:#fff;box-shadow:0 8px 18px var(--shadow-color)}
    .btn-gold{background:linear-gradient(140deg,var(--gold),var(--gold));border-color:var(--gold);color:var(--navy);box-shadow:0 8px 18px var(--shadow-color)}
    .btn-soft{background:var(--gray-100);color:var(--navy)}
    .btn-danger{color:var(--red);border-color:var(--danger-bg);background:var(--red-bg)}
    .toolbar{padding:14px;display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:12px;align-items:center}
    .search{height:46px;border:1px solid var(--line);background:var(--gray-100);border-radius:12px;display:flex;align-items:center;padding:0 12px;gap:9px}
    .search svg{width:19px;height:19px;color:var(--navy);flex:none}
    .search input{min-width:0;width:100%;border:0;outline:0;background:transparent}
    .chips{display:flex;gap:7px;overflow:auto;padding-bottom:2px}
    .chip{border:1px solid var(--line);background:#fff;border-radius:999px;min-height:38px;padding:7px 12px;font-size:.75rem;font-weight:850;white-space:nowrap}
    .chip.active{background:var(--navy);border-color:var(--navy);color:#fff}
    .progress-card{padding:16px 18px;display:grid;grid-template-columns:auto minmax(140px,1fr) auto;gap:14px;align-items:center}
    .progress-figure{font-size:1.45rem;font-weight:950;color:var(--navy);letter-spacing:-.03em}
    .progress-track{height:10px;border-radius:99px;background:var(--gray-100);overflow:hidden}
    .progress-fill{height:100%;width:72%;background:linear-gradient(90deg,var(--gold),var(--gold));border-radius:99px;transition:width .35s}
    .progress-copy{font-size:.78rem;color:var(--muted);font-weight:800;text-align:right}
    .product-list{overflow:hidden}
    .product-list-head,.product-row{display:grid;grid-template-columns:minmax(260px,1.5fr) minmax(160px,.85fr) 125px 160px 104px;gap:0;align-items:stretch}
    .product-list-head{background:linear-gradient(100deg,var(--navy-3),var(--navy));color:#fff;padding:0 12px}
    .product-list-head>div{padding:12px 10px;font-size:.72rem;font-weight:850}
    .product-row{padding:0 12px;border-top:1px solid var(--line);background:#fff}
    .product-row:hover{background:var(--gray-100)}
    .product-cell{padding:13px 10px;min-width:0;display:flex;align-items:center}
    .product-main{display:grid;grid-template-columns:56px minmax(0,1fr);gap:11px;align-items:center}
    .thumb{width:56px;height:56px;border-radius:13px;background:linear-gradient(145deg,var(--gray-100),var(--gray-100));border:1px solid var(--gray-100);display:grid;place-items:center;color:var(--navy)}
    .thumb svg{width:30px;height:30px}
    .product-code{font:750 .68rem ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--gray-400)}
    .product-name{font-size:.84rem;font-weight:850;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
    .cell-stack{display:block}
    .cell-mobile-label{display:none;color:var(--navy);font-size:.68rem;font-weight:750;margin-bottom:3px}
    .cell-value{font-size:.8rem;font-weight:750;color:var(--navy)}
    .status{display:inline-flex;align-items:center;gap:7px;min-height:32px;border-radius:999px;padding:6px 10px;font-size:.72rem;font-weight:900;white-space:nowrap}
    .status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.75}
    .status.found,.status.complete{background:var(--green-bg);color:var(--green)}
    .status.not_found{background:var(--red-bg);color:var(--red)}
    .status.alternative_available{background:var(--amber-bg);color:var(--amber)}
    .status.unanswered,.status.waiting{background:var(--blue-bg);color:var(--blue)}
    .request-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
    .source-card{padding:18px;display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:15px;align-items:center}
    .source-card .thumb{width:76px;height:76px}
    .source-card .thumb svg{width:40px;height:40px}
    .source-title{font-size:1.05rem;font-weight:900;color:var(--navy)}
    .source-fields{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
    .source-field span{display:block;font-size:.68rem;color:var(--navy);font-weight:750}
    .source-field strong{display:block;margin-top:2px;font-size:.82rem}
    .form-card{overflow:hidden}
    .form-section{padding:19px;border-top:1px solid var(--line)}
    .form-section:first-child{border-top:0}
    .form-section-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:14px}
    .form-section h3{margin:0;color:var(--navy);font-size:1rem}
    .segmented{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .segmented button{min-height:48px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:7px 10px;font-size:.78rem;font-weight:850}
    .segmented button.selected{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);background:var(--gray-100);color:var(--navy)}
    .fields{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
    .field{grid-column:span 4;min-width:0}
    .field.span-2{grid-column:span 2}.field.span-3{grid-column:span 3}.field.span-6{grid-column:span 6}.field.span-8{grid-column:span 8}.field.span-12{grid-column:span 12}
    .field label{display:block;font-size:.75rem;font-weight:850;color:var(--navy);margin-bottom:6px}
    .field .required{color:var(--red);margin-left:3px}
    .input,.field input,.field select,.field textarea{width:100%;min-height:44px;border:1px solid var(--gray-100);background:#fff;border-radius:11px;padding:9px 11px;outline:0}
    .field textarea{min-height:88px;resize:vertical}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px var(--shadow-color)}
    .field.has-error input,.field.has-error select,.field.has-error textarea{border-color:var(--red);box-shadow:0 0 0 3px var(--shadow-color)}
    .error{color:var(--red);font-size:.72rem;font-weight:750;margin-top:5px}
    .check{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--gray-100);border-radius:12px;padding:12px;min-height:48px}
    .check input{width:18px;height:18px;accent-color:var(--navy);margin-top:2px;flex:none}
    .check label{font-size:.79rem;font-weight:750;line-height:1.35}
    .tier-table{display:grid;gap:8px}
    .tier-row{display:grid;grid-template-columns:1fr 1fr 1fr 44px;gap:8px}
    .tier-row input{width:100%;min-width:0;height:42px;border:1px solid var(--gray-100);border-radius:10px;padding:8px 10px}
    .tier-remove{height:42px;border:1px solid var(--danger-bg);color:var(--red);background:var(--red-bg);border-radius:10px;font-weight:900}
    .notice{border:1px solid var(--warning-bg);background:var(--amber-bg);border-radius:14px;padding:14px;color:var(--warning);font-size:.81rem;font-weight:750}
    .notice.info{border-color:var(--gray-100);background:var(--blue-bg);color:var(--navy)}
    .notice.success{border-color:var(--success-bg);background:var(--green-bg);color:var(--success)}
    .notice.danger{border-color:var(--danger-bg);background:var(--red-bg);color:var(--danger)}
    .confirm-change{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .confirm-actions{display:flex;gap:8px;flex:none}
    .boundary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .boundary{border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--gray-100)}
    .chat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .chat-option{min-height:48px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;padding:10px 12px;font-size:.77rem;font-weight:750;color:var(--navy)}
    .chat-option:hover,.chat-option.selected{border-color:var(--navy);background:var(--blue-bg);color:var(--navy)}
    .raw{margin-top:9px;padding:8px 9px;border-radius:9px;background:var(--gray-100);color:var(--navy);font:650 .7rem ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-word}
    .partial-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .metric{padding:20px}
    .metric-number{font-size:2.25rem;line-height:1;font-weight:950;color:var(--navy);letter-spacing:-.05em}
    .metric-label{margin-top:8px;color:var(--gray-500);font-size:.83rem;font-weight:800}
    .submit-box{max-width:820px;margin:auto;padding:24px}
    .submit-box h3{font-size:1.35rem;color:var(--navy);margin:0}
    .submit-box>p{color:var(--navy)}
    .submit-checks{display:grid;gap:10px;margin:18px 0}
    .success-hero{padding:34px;text-align:center;background:linear-gradient(145deg,#fff,var(--success-bg))}
    .success-icon{width:76px;height:76px;margin:auto;border-radius:24px;background:var(--green-bg);color:var(--green);display:grid;place-items:center}
    .success-icon svg{width:40px;height:40px}
    .success-hero h3{font-size:1.65rem;color:var(--navy);margin:16px 0 5px}
    .success-hero p{max-width:670px;margin:8px auto;color:var(--navy)}
    .reference{display:inline-flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:16px}
    .reference span{padding:9px 12px;border:1px solid var(--success-bg);background:#fff;border-radius:10px;color:var(--success);font-size:.79rem;font-weight:800}
    .readonly-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .readonly-item{padding:14px;border:1px solid var(--line);border-radius:13px;background:var(--gray-100)}
    .readonly-item span{display:block;font-size:.68rem;font-weight:750;color:var(--navy)}
    .readonly-item strong{display:block;margin-top:4px;font-size:.85rem}
    .revision-band{padding:20px;color:#fff;background:linear-gradient(115deg,var(--navy),var(--navy));display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
    .revision-band h3{margin:0;font-size:1.3rem}.revision-band p{margin:5px 0 0;color:var(--gray-100)}
    .round-chip{border:1px solid var(--shadow-color);background:var(--shadow-color);border-radius:14px;padding:12px 17px;font-weight:900;font-size:1.1rem}
    .diff-list{display:grid;gap:10px;padding:16px}
    .diff-row{display:grid;grid-template-columns:minmax(180px,1fr) 1fr 42px 1fr;gap:10px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:12px}
    .diff-product{font-size:.82rem;font-weight:850}.diff-product small{display:block;color:var(--gray-400);margin-top:3px}
    .diff-value{padding:9px;border-radius:9px;background:var(--gray-100);font-size:.77rem;font-weight:800}
    .diff-value.new{background:var(--amber-bg);color:var(--warning)}
    .arrow{display:grid;place-items:center;color:var(--navy);font-size:1.2rem}
    .bottom{position:fixed;left:0;right:0;bottom:0;z-index:45;border-top:1px solid var(--line);background:var(--shadow-color);backdrop-filter:blur(16px);padding:12px 24px calc(12px + var(--safe))}
    .bottom-inner{max-width:1500px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:14px;padding-left:258px}
    .bottom-left,.bottom-right{display:flex;gap:8px;align-items:center}
    .toast{position:fixed;z-index:80;right:22px;bottom:100px;max-width:min(430px,calc(100vw - 32px));padding:13px 15px;border-radius:13px;background:var(--navy);color:#fff;box-shadow:var(--shadow);font-size:.8rem;font-weight:800;transform:translateY(20px);opacity:0;pointer-events:none;transition:.22s}
    .toast.show{transform:none;opacity:1}
    .empty{padding:34px;text-align:center;color:var(--gray-500)}
    .hidden{display:none!important}
    @media (max-width:1120px){
      .topbar-inner{grid-template-columns:1fr auto}.context{grid-column:1/-1;grid-row:2}.page{grid-template-columns:205px minmax(0,1fr)}
      .bottom-inner{padding-left:225px}.product-list-head,.product-row{grid-template-columns:minmax(220px,1.35fr) minmax(145px,.8fr) 110px 145px 94px}
      .field{grid-column:span 6}.field.span-2,.field.span-3{grid-column:span 3}.field.span-8{grid-column:span 9}
    }
    @media (max-width:800px){

      .workflow{padding:8px 10px;gap:3px}.workflow button{justify-content:center;padding:6px 3px}.workflow button:not(:last-child)::after{width:9px;right:-6px}.wf-dot{width:27px;height:27px}.wf-text{display:none}

    /* Görev #30-R — yalnız görsel katman. HTML yapısı ve JS akışları değişmez. */
    :root{
      --navy:#0F2557;
      --gold:#D4A017;
      --gray-50:#F8FAFC;
      --gray-100:#F1F5F9;
      --gray-200:#E2E8F0;
      --gray-300:#CBD5E1;
      --gray-400:#94A3B8;
      --gray-500:#64748B;
      --gray-600:#475569;
      --gray-700:#334155;
      --gray-800:#1E293B;
      --gray-900:#0F172A;
      --success:#166534;
      --success-bg:#F0FDF4;
      --warning:#854D0E;
      --warning-bg:#FFFBEB;
      --danger:#991B1B;
      --danger-bg:#FEF2F2;
      --shadow-color:rgba(15,23,42,.08);
      --shadow:0 8px 24px var(--shadow-color);
      --radius:12px;
      --navy-2:var(--navy);
      --navy-3:var(--navy);
      --gold-2:var(--gold);
      --ink:var(--gray-900);
      --muted:var(--gray-500);
      --line:var(--gray-200);
      --soft:var(--gray-50);
      --white:#FFFFFF;
      --green:var(--success);
      --green-bg:var(--success-bg);
      --amber:var(--warning);
      --amber-bg:var(--warning-bg);
      --red:var(--danger);
      --red-bg:var(--danger-bg);
      --blue:var(--navy);
      --blue-bg:var(--gray-100);
    }
    html{font-size:16px}
    body{
      background:var(--gray-100);
      color:var(--gray-900);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
      font-size:14px;
      line-height:1.5;
      -webkit-font-smoothing:antialiased;
    }
    button,input,select,textarea{font-family:inherit}
    button:disabled{opacity:.48}
    :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
    .app{padding-bottom:calc(80px + var(--safe))}

    .topbar{
      background:var(--navy);
      color:var(--gray-50);
      border-bottom:2px solid var(--gold);
    }
    .topbar-inner{
      max-width:1400px;
      padding:16px 24px;
      grid-template-columns:minmax(248px,1fr) minmax(400px,1.6fr) auto;
      gap:24px;
    }
    .brand{gap:12px}
    .brand-mark{
      width:44px;
      height:44px;
      border-radius:10px;
      background:var(--gray-50);
      border:2px solid var(--gold);
      color:var(--navy);
      box-shadow:none;
    }
    .brand-mark svg{width:24px;height:24px}
    .eyebrow{font-size:.68rem;font-weight:700;color:var(--gray-300)}
    .brand h1{font-size:1.05rem;font-weight:700;margin-top:4px}
    .context{gap:12px}
    .context-item{border-color:var(--gray-600);padding-left:12px}
    .context-label{font-size:.68rem;color:var(--gray-300);font-weight:600}
    .context-value{font-size:.82rem;font-weight:700;margin-top:4px;color:var(--gray-50)}
    .top-actions{gap:8px}
    .lang{
      padding:4px;
      background:var(--gray-800);
      border-color:var(--gray-700);
      border-radius:10px;
    }
    .lang button{
      min-width:40px;
      height:32px;
      border-radius:8px;
      color:var(--gray-300);
      font-size:.75rem;
      font-weight:700;
    }
    .lang button[aria-current="true"]{
      background:var(--gray-50);
      color:var(--navy);
      border-bottom:2px solid var(--gold);
      box-shadow:none;
    }
    .connection{
      width:40px;
      height:40px;
      border-radius:10px;
      border-color:var(--gray-700);
      background:var(--gray-800);
      color:var(--gray-50);
    }

    .workflow-wrap{background:var(--white);border-color:var(--gray-200)}
    .workflow{max-width:1400px;padding:8px 24px;gap:8px}
    .workflow button{
      gap:8px;
      border-radius:8px;
      padding:8px;
      color:var(--gray-600);
    }
    .workflow button:hover{background:var(--gray-50)}
    .workflow button:not(:last-child)::after{width:16px;right:-12px;background:var(--gray-200)}
    .workflow button.current{background:var(--gray-50);border-color:var(--gold)}
    .wf-dot{
      width:28px;
      height:28px;
      border-color:var(--gray-300);
      color:var(--gray-500);
      background:var(--white);
      font-size:.7rem;
      font-weight:700;
    }
    .workflow button.done .wf-dot{
      background:var(--white);
      border-color:var(--gold);
      color:var(--navy);
    }
    .workflow button.current .wf-dot{
      background:var(--gold);
      border-color:var(--gold);
      color:var(--navy);
      box-shadow:none;
    }
    .wf-code{color:var(--gray-500);font-size:.62rem;font-weight:600}
    .wf-label{color:var(--navy);font-size:.75rem;font-weight:700}

    .page{
      max-width:1400px;
      padding:20px 24px 0;
      grid-template-columns:216px minmax(0,1fr);
      gap:16px;
    }
    .side{
      top:160px;
      border-color:var(--gray-200);
      border-radius:12px;
      padding:8px;
      box-shadow:var(--shadow);
    }
    .side button{
      min-height:44px;
      grid-template-columns:28px minmax(0,1fr);
      gap:8px;
      border-left:3px solid transparent;
      border-radius:8px;
      padding:8px;
      color:var(--gray-600);
    }
    .side button+button{margin-top:4px}
    .side button:hover{background:var(--gray-50);color:var(--navy)}
    .side button.active{
      background:var(--gray-50);
      color:var(--navy);
      border-left-color:var(--gold);
      box-shadow:none;
    }
    .step-no{font-size:.68rem;font-weight:700;color:var(--gray-400)}
    .side button.active .step-no{color:var(--gold)}
    .step-label{font-size:.78rem;font-weight:700}
    .source-proof{
      margin:8px 4px 0;
      padding-top:8px;
      border-color:var(--gray-200);
      color:var(--gray-500);
      font-size:.6rem;
      font-weight:600;
    }

    .screen-head{gap:16px;margin:0 0 12px}
    .screen-kicker{color:var(--gold);font-size:.68rem;font-weight:700}
    .screen-head h2{
      margin-top:4px;
      color:var(--navy);
      font-size:1.25rem;
      line-height:1.25;
      font-weight:700;
      letter-spacing:-.01em;
    }
    .key{margin-top:4px;color:var(--gray-400);font-size:.6rem;font-weight:600}
    .save-state{
      min-height:32px;
      gap:8px;
      padding:6px 10px;
      border-color:var(--gray-200);
      background:var(--white);
      border-radius:8px;
      color:var(--gray-600);
      font-size:.75rem;
      font-weight:600;
    }
    .save-state .pulse{background:var(--success)}
    .save-state.busy .pulse{background:var(--gold)}
    .save-state.offline .pulse{background:var(--danger)}

    .card{
      background:var(--white);
      border-color:var(--gray-200);
      border-radius:12px;
      box-shadow:var(--shadow);
    }
    .card-pad{padding:20px}
    .hero{min-height:240px;grid-template-columns:minmax(0,1.45fr) minmax(300px,.75fr)}
    .hero-main{padding:24px;background:var(--white)}
    .hero-main::after{display:none}
    .hero h3{
      margin:0;
      max-width:680px;
      color:var(--navy);
      font-size:1.5rem;
      line-height:1.2;
      font-weight:700;
      letter-spacing:-.02em;
    }
    .hero p{max-width:680px;margin:12px 0 20px;color:var(--gray-600);font-size:.94rem}
    .hero-meta{gap:8px}
    .meta-pill{
      padding:12px;
      border-color:var(--gray-200);
      border-radius:8px;
      background:var(--gray-50);
      color:var(--gray-600);
      font-size:.78rem;
      font-weight:600;
    }
    .hero-side{padding:24px;background:var(--navy);color:var(--gray-50)}
    .hero-side .key{color:var(--gray-400)}
    .instruction-title{gap:8px;font-size:.94rem;font-weight:700}
    .instruction-list{gap:12px;margin:16px 0 20px}
    .instruction-item{grid-template-columns:20px 1fr;gap:8px;color:var(--gray-100);font-size:.8rem}
    .instruction-item svg{color:var(--gold)}

    .section{margin-top:16px}
    .section-title{gap:12px;margin-bottom:8px}
    .section-title h3{color:var(--navy);font-size:.94rem;font-weight:700}
    .btn{
      min-height:40px;
      border-color:var(--gray-300);
      border-radius:8px;
      background:var(--white);
      color:var(--gray-700);
      padding:8px 12px;
      font-size:.8rem;
      font-weight:700;
      box-shadow:none;
    }
    .btn svg{width:16px;height:16px}
    .btn:hover{background:var(--gray-50);border-color:var(--gray-400)}
    .btn-primary{
      background:var(--navy);
      border-color:var(--navy);
      color:var(--white);
      box-shadow:none;
    }
    .btn-primary:hover{background:var(--navy);border-color:var(--navy)}
    .btn-soft{
      background:transparent;
      border-color:transparent;
      color:var(--navy);
      box-shadow:none;
    }
    .btn-soft:hover{background:var(--gray-100);border-color:var(--gray-100)}
    .btn-gold{
      background:var(--gray-50);
      border-color:var(--gray-50);
      color:var(--navy);
      box-shadow:none;
    }
    .btn-gold:hover{background:var(--white);border-color:var(--white)}
    .btn-danger{background:var(--white);border-color:var(--gray-300);color:var(--gray-700)}

    .toolbar{padding:12px;gap:12px}
    .search{
      height:40px;
      border-color:var(--gray-300);
      background:var(--white);
      border-radius:8px;
      padding:0 12px;
      gap:8px;
    }
    .search svg{width:16px;height:16px;color:var(--gray-500)}
    .chips{gap:8px}
    .chip{
      min-height:36px;
      padding:6px 12px;
      border-color:var(--gray-300);
      border-radius:8px;
      background:var(--white);
      color:var(--gray-600);
      font-size:.72rem;
      font-weight:700;
    }
    .chip:hover{background:var(--gray-50);color:var(--navy)}
    .chip.active{background:var(--white);border-color:var(--gold);color:var(--navy)}

    .progress-card{padding:12px 16px;gap:12px}
    .progress-figure{color:var(--navy);font-size:1.2rem;font-weight:700}
    .progress-track{height:6px;border-radius:8px;background:var(--gray-200)}
    .progress-fill{background:var(--gold);border-radius:8px}
    .progress-copy{color:var(--gray-500);font-size:.75rem;font-weight:600}

    .product-list-head,.product-row{
      grid-template-columns:minmax(260px,1.5fr) minmax(160px,.85fr) 124px 152px 104px;
    }
    .product-list-head{background:var(--navy);color:var(--white);padding:0 12px}
    .product-list-head>div{
      padding:12px 10px;
      border-left:1px solid var(--gray-700);
      font-size:.68rem;
      font-weight:700;
      letter-spacing:.03em;
    }
    .product-list-head>div:first-child{border-left:0}
    .product-list-head>div:nth-child(3){text-align:right}
    .product-row{padding:0 12px;border-color:var(--gray-200);background:var(--white)}
    .product-row:hover{background:var(--gray-50)}
    .product-cell{padding:12px 10px;border-left:1px solid var(--gray-100)}
    .product-cell:first-child{border-left:0}
    .product-row .product-cell:nth-child(3){justify-content:flex-end;text-align:right;font-variant-numeric:tabular-nums}
    .product-row .product-cell:last-child{justify-content:flex-end}
    .product-main{grid-template-columns:48px minmax(0,1fr);gap:12px}
    .thumb{
      width:48px;
      height:48px;
      border-radius:8px;
      background:var(--gray-100);
      border-color:var(--gray-200);
      color:var(--navy);
    }
    .thumb svg{width:24px;height:24px}
    .product-code{color:var(--gray-400);font-size:.64rem;font-weight:600}
    .product-name{margin-top:4px;color:var(--gray-800);font-size:.8rem;font-weight:700}
    .cell-mobile-label{color:var(--gray-500);font-size:.64rem;font-weight:600}
    .cell-value{color:var(--gray-600);font-size:.78rem;font-weight:600}
    .status{
      min-height:28px;
      gap:6px;
      border-radius:8px;
      padding:4px 8px;
      font-size:.68rem;
      font-weight:700;
    }
    .status::before{width:8px;height:8px}
    .status.found,.status.complete{background:var(--success-bg);color:var(--success)}
    .status.not_found{background:var(--danger-bg);color:var(--danger)}
    .status.alternative_available{background:var(--warning-bg);color:var(--warning)}
    .status.unanswered,.status.waiting{background:var(--gray-100);color:var(--gray-600)}

    .request-grid{gap:16px}
    .source-card{padding:16px;grid-template-columns:64px minmax(0,1fr) auto;gap:16px}
    .source-card .thumb{width:64px;height:64px}
    .source-card .thumb svg{width:32px;height:32px}
    .source-title{color:var(--navy);font-size:.96rem;font-weight:700}
    .source-fields{gap:16px;margin-top:8px}
    .source-field span{color:var(--gray-500);font-size:.64rem;font-weight:600}
    .source-field strong{font-size:.78rem;font-weight:700}
    .form-section{padding:16px;border-color:var(--gray-200)}
    .form-section-head{gap:12px;margin-bottom:12px}
    .form-section h3{color:var(--navy);font-size:.94rem;font-weight:700}
    .segmented{gap:8px}
    .segmented button{
      min-height:44px;
      border-color:var(--gray-300);
      border-radius:8px;
      background:var(--white);
      color:var(--gray-600);
      font-size:.75rem;
      font-weight:700;
    }
    .segmented button:hover{background:var(--gray-50);color:var(--navy)}
    .segmented button.selected{
      border-color:var(--gold);
      background:var(--gray-50);
      color:var(--navy);
      box-shadow:none;
    }
    .fields{gap:12px}
    .field label{margin-bottom:4px;color:var(--gray-700);font-size:.72rem;font-weight:700}
    .field .required,.error{color:var(--danger)}
    .input,.field input,.field select,.field textarea,.tier-row input{
      min-height:40px;
      border-color:var(--gray-300);
      border-radius:8px;
      background:var(--white);
      padding:8px 10px;
    }
    .field textarea{min-height:80px}
    .field input:focus,.field select:focus,.field textarea:focus,.tier-row input:focus{
      border-color:var(--navy);
      outline:2px solid var(--gold);
      outline-offset:1px;
      box-shadow:none;
    }
    .field.has-error input,.field.has-error select,.field.has-error textarea{
      border-color:var(--danger);
      box-shadow:none;
    }
    .error{margin-top:4px;font-size:.68rem;font-weight:600}
    .check{
      min-height:44px;
      gap:8px;
      padding:10px;
      border-color:var(--gray-200);
      border-radius:8px;
      background:var(--gray-50);
    }
    .check input{width:16px;height:16px;margin-top:4px;accent-color:var(--navy)}
    .check label{font-size:.76rem;font-weight:600}
    .tier-table{gap:8px}
    .tier-row{grid-template-columns:1fr 1fr 1fr 40px;gap:8px}
    .tier-row input{height:40px}
    .tier-remove{
      height:40px;
      border-color:var(--gray-300);
      border-radius:8px;
      background:var(--white);
      color:var(--gray-600);
      font-weight:700;
    }
    .tier-remove:hover{background:var(--gray-50);color:var(--gray-900)}

    .notice{
      border-color:var(--warning);
      border-radius:8px;
      background:var(--warning-bg);
      color:var(--warning);
      padding:12px;
      font-size:.78rem;
      font-weight:600;
    }
    .notice.info{border-color:var(--gray-300);background:var(--gray-50);color:var(--navy)}
    .notice.success{border-color:var(--success);background:var(--success-bg);color:var(--success)}
    .notice.danger{border-color:var(--danger);background:var(--danger-bg);color:var(--danger)}
    [style*="margin-top:14px"]{margin-top:16px!important}
    [style*="margin-bottom:14px"]{margin-bottom:16px!important}
    .confirm-change{margin-top:12px;gap:12px}
    .confirm-actions{gap:8px}
    .boundary-grid{gap:12px}
    .boundary{border-color:var(--gray-200);border-radius:8px;padding:12px;background:var(--gray-50)}
    .chat-grid{gap:8px}
    .chat-option{
      min-height:44px;
      border-color:var(--gray-300);
      border-radius:8px;
      background:var(--white);
      color:var(--gray-600);
      padding:10px 12px;
      font-size:.75rem;
      font-weight:600;
    }
    .chat-option:hover,.chat-option.selected{border-color:var(--gold);background:var(--gray-50);color:var(--navy)}
    .raw{margin-top:8px;padding:8px;border-radius:8px;background:var(--gray-100);color:var(--gray-600);font-size:.68rem;font-weight:600}

    .partial-grid{gap:16px}
    .metric{padding:20px}
    .metric-number{color:var(--navy);font-size:1.75rem;font-weight:700;letter-spacing:-.03em}
    .metric-label{margin-top:8px;color:var(--gray-500);font-size:.8rem;font-weight:600}
    .submit-box{max-width:800px;padding:24px}
    .submit-box h3{color:var(--navy);font-size:1.15rem;font-weight:700}
    .submit-box>p{color:var(--gray-600)}
    .submit-checks{gap:8px;margin:16px 0}
    .success-hero{padding:32px;background:var(--white)}
    .success-icon{width:64px;height:64px;border-radius:12px;background:var(--success-bg);color:var(--success)}
    .success-icon svg{width:32px;height:32px}
    .success-hero h3{margin:16px 0 4px;color:var(--navy);font-size:1.3rem;font-weight:700}
    .success-hero p{color:var(--gray-600)}
    .reference{gap:8px;margin-top:16px}
    .reference span{
      padding:8px 12px;
      border-color:var(--gray-200);
      border-radius:8px;
      background:var(--white);
      color:var(--navy);
      font-size:.76rem;
      font-weight:600;
    }
    .readonly-grid{gap:8px}
    .readonly-item{padding:12px;border-color:var(--gray-200);border-radius:8px;background:var(--gray-50)}
    .readonly-item span{color:var(--gray-500);font-size:.64rem;font-weight:600}
    .readonly-item strong{margin-top:4px;font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
    .card>p[style*="text-align:center"]{color:var(--gray-500)!important}

    .revision-band{
      padding:20px;
      background:var(--navy);
      color:var(--white);
      border-bottom:2px solid var(--gold);
      gap:16px;
    }
    .revision-band h3{font-size:1.1rem;font-weight:700}
    .revision-band p{margin-top:4px;color:var(--gray-300)}
    .round-chip{
      border-color:var(--gray-600);
      background:var(--gray-800);
      border-radius:8px;
      padding:8px 12px;
      color:var(--white);
      font-size:.94rem;
      font-weight:700;
    }
    .diff-list{gap:8px;padding:16px}
    .diff-row{gap:8px;border-color:var(--gray-200);border-radius:8px;padding:12px}
    .diff-product{font-size:.78rem;font-weight:700}
    .diff-product small{color:var(--gray-500);margin-top:4px}
    .diff-value{padding:8px;border-radius:8px;background:var(--gray-100);font-size:.75rem;font-weight:600;font-variant-numeric:tabular-nums}
    .diff-value.new{background:var(--warning-bg);color:var(--warning)}
    .arrow{color:var(--gray-400)}

    .bottom{
      border-color:var(--gray-200);
      background:var(--white);
      backdrop-filter:none;
      padding:12px 24px calc(12px + var(--safe));
    }
    .bottom-inner{max-width:1400px;gap:12px;padding-left:232px}
    .bottom-left,.bottom-right{gap:8px}
    .toast{
      right:24px;
      bottom:88px;
      padding:12px 16px;
      border-radius:8px;
      background:var(--navy);
      color:var(--white);
      box-shadow:var(--shadow);
      font-size:.78rem;
      font-weight:600;
    }
    .empty{padding:32px;color:var(--gray-500)}

    @media (max-width:1120px){
      .page{grid-template-columns:200px minmax(0,1fr)}
      .bottom-inner{padding-left:216px}
      .product-list-head,.product-row{grid-template-columns:minmax(220px,1.35fr) minmax(144px,.8fr) 108px 144px 92px}
    }
    @media (max-width:800px){
      .app{padding-bottom:calc(152px + var(--safe))}
      .topbar-inner{padding:12px 16px}
      .brand-mark{width:40px;height:40px}
      .page{padding:16px 12px 0}
      .side{padding:8px;margin-bottom:16px;border-radius:12px}
      .side button{min-width:48px;min-height:40px;border-left:0;border-bottom:2px solid transparent;border-radius:8px}
      .side button.active{border-bottom-color:var(--gold)}
      .screen-head h2{font-size:1.15rem}
      .hero-main,.hero-side{padding:20px}
      .hero h3{font-size:1.35rem}
      .product-row{padding:12px}
      .product-cell{padding:8px 4px;border-left:0}
      .product-cell:not(:first-child){border-color:var(--gray-200)}
      .source-card{grid-template-columns:56px minmax(0,1fr);padding:12px}
      .source-card .thumb{width:56px;height:56px}
      .fields{gap:12px}
      .bottom{padding:8px 12px calc(8px + var(--safe))}
      .toast{right:16px;bottom:160px}
    }
    @media (max-width:390px){
      .card-pad{padding:16px}
      .screen-head h2{font-size:1.08rem}
    }
  </style>
</head>

        <div class="diff-row"><div class="diff-product">TH-009 · ${esc(value(products.find(p=>p.code==='TH-009').name))}<small>${esc(t('portal.field.lead_time'))}</small></div><div class="diff-value">45 · calendar_day</div><div class="arrow">→</div><div class="diff-value new">36 · calendar_day</div></div>
        <div class="diff-row"><div class="diff-product">TH-016 · ${esc(value(products.find(p=>p.code==='TH-016').name))}<small>${esc(t('portal.field.ddp_unit_price_vat_included'))}</small></div><div class="diff-value">248 TRY / ${esc(unit(1).split(' ')[1])}</div><div class="arrow">→</div><div class="diff-value new">274 TRY / ${esc(unit(1).split(' ')[1])}</div></div>
      </div></section><section class="card card-pad section"><div class="notice info">${esc(t('portal.success.read_only'))}${keyline('portal.success.read_only')}</div><div class="section">${readonlyCards()}</div></section>`;
      const renderScreen=()=>[welcome,productList,responseForm,partial,submit,success,revision][state.screen]();
      const bottomBar=()=>{let left=`<button type="button" class="btn" data-screen="${Math.max(0,state.screen-1)}" ${state.screen===0?'disabled':''}>${esc(t('portal.action.back'))}</button><button type="button" class="btn btn-soft" data-action="save">${icon('save')}${esc(t('portal.action.save_draft'))}</button>`;let right='';
        if(state.screen===1)right=`<button type="button" class="btn" data-screen="3" ${!state.online?'disabled':''}>${esc(t('portal.action.submit_partial'))}</button><button type="button" class="btn btn-primary" data-screen="4" ${!state.online?'disabled':''}>${esc(t('portal.action.submit_quote'))}</button>`;
        else if(state.screen===2)right=`<button type="button" class="btn" data-action="previous-row">${esc(t('portal.action.previous_product'))}</button><button type="button" class="btn btn-primary" data-action="next-row">${esc(t('portal.action.next_product'))}</button>`;
        else if(state.screen===3)right=`<button type="button" class="btn btn-primary" data-action="partial-submit" ${!state.online?'disabled':''}>${esc(t('portal.partial.button'))}</button>`;
        else if(state.screen===4)right=`<button type="button" class="btn btn-primary" data-action="final-submit" ${completed()!==25||!state.online||state.submitChecks.some(x=>!x)?'disabled':''}>${esc(t('portal.submit.button'))}</button>`;
        else if(state.screen===0)right=`<button type="button" class="btn btn-primary" data-screen="1">${esc(t('portal.action.continue'))}${icon('arrow')}</button>`;
        else if(state.screen===6)right=`<button type="button" class="btn btn-primary" data-screen="2">${esc(t('portal.action.continue'))}${icon('arrow')}</button>`;
        return `<div class="bottom"><div class="bottom-inner"><div class="bottom-left">${left}</div><div class="bottom-right">${right}</div></div></div>`;
      };
      const clearCommercial=()=>{Object.assign(state.form,{price:'',vat:false,moq:'',lead:'',tiers:[]})};
      const requestStatus=s=>{if(s===state.form.status)return;if(state.form.price&&['unanswered','not_found'].includes(s)){state.pendingStatus=s;render();return}state.form.status=s;state.pendingStatus=null;state.errors={};scheduleSave(true)};
      const validate=()=>{const e={};const f=state.form;if(f.status==='unanswered')e.status='portal.validation.status_required';if(['found','alternative_available'].includes(f.status)){if(!(Number(f.price)>0))e.price='portal.validation.found_price_required';if(!f.currency)e.currency='portal.validation.currency_required';if(!f.vat)e.vat='portal.validation.ddp_vat_confirmation_required';if(!(Number(f.moq)>0))e.moq='portal.validation.found_moq_required';if(!(Number(f.lead)>0))e.lead='portal.validation.found_lead_time_required'}if(f.status==='not_found'&&f.note.trim().length<3)e.note='portal.validation.not_found_note_required';if(f.status==='alternative_available'&&!f.altLink.trim()&&!f.altDetails.trim())e.altLink='portal.validation.alternative_details_required';const dims=[f.length,f.width,f.height];if(dims.some(Boolean)&&!dims.every(Boolean))e.length='portal.validation.carton_dimensions_together';if(f.tiers.some(r=>!r.min||!r.price))e.tiers='portal.validation.tier_incomplete';for(let i=1;i<f.tiers.length;i++){if(Number(f.tiers[i].min)<=Number(f.tiers[i-1].min))e.tiers='portal.validation.tier_order';if(f.tiers[i-1].max&&Number(f.tiers[i].min)<=Number(f.tiers[i-1].max))e.tiers='portal.validation.tier_overlap'}state.errors=e;render();return Object.keys(e).length===0};
      const render=()=>{document.documentElement.lang=state.lang==='zh'?'zh-CN':state.lang;document.getElementById('app').innerHTML=shell();bind()};
      const bind=()=>{
        document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;render()});
        document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{state.screen=Number(b.dataset.screen);render();window.scrollTo({top:0,behavior:'smooth'})});
        document.querySelectorAll('[data-workflow]').forEach(b=>b.onclick=()=>{state.workflow=b.dataset.workflow;if(state.workflow==='RESPONDED')state.screen=4;if(state.workflow==='APPROVED')state.screen=5;render()});
        document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=state.filter===b.dataset.filter?null:b.dataset.filter;render()});
        document.querySelectorAll('[data-open-row]').forEach(b=>b.onclick=()=>{state.activeProduct=b.dataset.openRow;state.form.status=currentProduct().status;state.pendingStatus=null;state.errors={};state.screen=2;render()});
        document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>{state.chatMessage=b.dataset.chat;showToast(t(state.chatMessage));render()});
        const search=document.getElementById('search');if(search)search.oninput=e=>{state.search=e.target.value;const pos=e.target.selectionStart;render();const next=document.getElementById('search');next.focus();next.setSelectionRange(pos,pos)};
        document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>requestStatus(b.dataset.status));
        document.querySelectorAll('[data-field]').forEach(el=>{el.oninput=e=>{const k=e.target.dataset.field;state.form[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;delete state.errors[k];scheduleSave()};el.onchange=el.oninput});
        document.querySelectorAll('[data-tier]').forEach(el=>el.oninput=e=>{const [i,k]=e.target.dataset.tier.split(':');state.form.tiers[Number(i)][k]=e.target.value;scheduleSave()});
        document.querySelectorAll('[data-remove-tier]').forEach(b=>b.onclick=()=>{state.form.tiers.splice(Number(b.dataset.removeTier),1);scheduleSave(true)});
        document.querySelectorAll('[data-submit-check]').forEach(el=>el.onchange=e=>{state.submitChecks[Number(e.target.dataset.submitCheck)]=e.target.checked;render()});
        document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{
          const a=b.dataset.action;
          if(a==='toggle-online'){state.online=!state.online;showToast(t(state.online?'portal.system.reconnected':'portal.system.offline'));render()}
          if(a==='save'){state.save='saving';render();setTimeout(()=>{state.save='saved';showToast(t('portal.system.saved_at',{kayit_zamani:state.savedAt}));render()},550)}
          if(a==='add-tier'){state.form.tiers.push({min:'',max:'',price:''});scheduleSave(true)}
          if(a==='confirm-status'){state.form.status=state.pendingStatus;clearCommercial();state.pendingStatus=null;state.errors={};scheduleSave(true)}
          if(a==='cancel-status'){state.pendingStatus=null;render()}
          if(a==='next-row'){if(validate()){showToast(t('portal.system.sync_complete'));state.screen=1;render()}}
          if(a==='previous-row'){state.screen=1;render()}
          if(a==='partial-submit'){if(!state.online){showToast(t('portal.system.offline'));return}state.partialSubmitted=true;showToast(t('portal.partial.success',{tamamlanan:18}));render()}
          if(a==='final-submit'){if(completed()!==25){showToast(t('portal.submit.blocked_incomplete'));return}if(state.submitChecks.some(x=>!x))return;state.workflow='RESPONDED';state.screen=5;showToast(t('portal.success.title'));render()}
        });
      };
      render();
    })();
  </script>
</body>
</html>
